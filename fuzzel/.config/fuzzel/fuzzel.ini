# fuzzel — https://codeberg.org/dnkl/fuzzel
# dpi-aware=no defers to the compositor's scale instead of guessing from EDID.

font=JetBrainsMono Nerd Font Mono:size=11
dpi-aware=no
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty -e
layer=overlay
lines=10
width=42
tabs=4
horizontal-pad=22
vertical-pad=18
inner-pad=8
line-height=22
fields=name,generic,comment,categories,filename,keywords
include=~/.config/fuzzel/accent.ini

[colors]
background=1e1e2ee6
text=cdd6f4ff
prompt=a6adc8ff
placeholder=6c7086ff
input=cdd6f4ff
selection=313244ff
selection-text=cdd6f4ff
counter=7f849cff

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
cancel=Escape Control+c Control+g
execute=Return KP_Enter Control+y
cursor-left=Left Control+b
cursor-right=Right Control+f
prev=Up Control+p
next=Down Control+n
