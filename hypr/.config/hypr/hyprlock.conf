# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Palette duplicated from lua/theme.lua -- hyprlock reads hyprlang, not Lua.
# The accent is sourced from rice-accent's generated file.
source = ~/.config/hypr/accent.conf   # $accent, $alt

$base     = rgba(1e1e2eff)
$crust    = rgba(11111bff)
$text     = rgba(cdd6f4ff)
$subtext0 = rgba(a6adc8ff)
$overlay0 = rgba(6c7086ff)
$red      = rgba(f38ba8ff)

$font = JetBrainsMono Nerd Font Mono

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# grace / no_fade_in are CLI flags in 0.9.x, not config options.

animations {
    enabled   = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn,  1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Whatever rice-wallpaper last set. Pushed well down in brightness: light
# wallpapers otherwise leave white text sitting on a bright blur.
background {
    monitor           = 
    path              = ~/.local/state/rice/current-wallpaper
    blur_passes       = 3
    blur_size         = 9
    noise             = 0.0117
    contrast          = 0.85
    brightness        = 0.38
    vibrancy          = 0.15
    vibrancy_darkness = 0.35
}

label {
    monitor       = 
    text          = cmd[update:1000] date +"%H:%M"
    font_size     = 100
    font_family   = $font
    color         = $text
    position      = 0, 130
    halign        = center
    valign        = center
    shadow_passes = 3
    shadow_size   = 5
    shadow_color  = $crust
}

label {
    monitor     = 
    text        = cmd[update:60000] date +"%A, %d %B"
    font_size   = 17
    font_family = $font
    color       = $subtext0
    position    = 0, 55
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = $crust
}

input-field {
    monitor           = 
    size              = 300, 54
    outline_thickness = 2
    rounding          = 27
    dots_size         = 0.26
    dots_spacing      = 0.4
    dots_center       = true

    outer_color = $accent
    inner_color = rgba(1e1e2ed9)
    font_color  = $text
    check_color = $alt
    fail_color  = $red

    fade_on_empty    = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text        = <span foreground="##f38ba8">$FAIL</span>

    position = 0, -55
    halign   = center
    valign   = center
}

label {
    monitor     = 
    text        = $USER
    font_size   = 13
    font_family = $font
    color       = $overlay0
    position    = 0, -120
    halign      = center
    valign      = center
}
