# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# hyprpaper 0.8.x needs the `wallpaper { }` block form. The old flat
# preload=/wallpaper=, syntax is silently ignored -> black screen.
# rice-wallpaper owns the symlink below and restarts the service (its
# hyprctl commands are gone in this version).

wallpaper {
    monitor  =
    path     = ~/.local/state/rice/current-wallpaper
    fit_mode = cover
}

splash = false
