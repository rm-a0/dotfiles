# kitty — https://sw.kovidgoyal.net/kitty/conf/
# Colours live in themes/; nothing below sets a colour directly.

include themes/catppuccin-mocha.conf

# ── Font ──────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 115%
disable_ligatures cursor

# ── Window ────────────────────────────────────────────────────────────
window_padding_width      10
confirm_os_window_close   0
hide_window_decorations   yes
remember_window_size      no
initial_window_width      110c
initial_window_height     30c

# kitty owns its alpha; lua/rules.lua pins it to 1.0 compositor-side.
background_opacity          0.72
dynamic_background_opacity  yes
background_blur             0

# ── Cursor ────────────────────────────────────────────────────────────
cursor_shape           beam
cursor_shape_unfocused hollow
cursor_beam_thickness  1.4
cursor_blink_interval  0
shell_integration      enabled no-cursor

# ── Scrollback & bell ─────────────────────────────────────────────────
scrollback_lines  10000
enable_audio_bell no
visual_bell_duration 0

# ── Tabs ──────────────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

# ── Keys ──────────────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
