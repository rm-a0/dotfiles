[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-decoration-layout=appmenu:

# No gtk-application-prefer-dark-theme here. libadwaita ignores it and warns
# on every launch ("Using GtkSettings:gtk-application-prefer-dark-theme with
# libadwaita is unsupported"); it reads org.gnome.desktop.interface
# color-scheme instead, which rice-gsettings sets to prefer-dark. Plain GTK4
# apps go dark from gtk-theme-name above. The GTK3 file still needs the key --
# GTK3 has no color-scheme.
